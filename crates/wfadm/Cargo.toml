[package]
name = "wfadm"
version = "0.9.0" #@gxl:set(version)
edition.workspace = true
license.workspace = true

[[bin]]
name = "wfadm"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
wp-core-connectors = { workspace = true }
wp-connector-api = { workspace = true }
wp-connectors = { workspace = true }
wf-config = { workspace = true }
wf-lang = { workspace = true }
# `.wfg` 场景由 wfgen 自己的解析器校验（单一事实源）：wf-lang（wp-reactor）里那份
# 是给引擎侧用的旧副本，不跟随 wfgen 的语法演进。
wfgen = { path = "../wfgen" }
ureq = { workspace = true }
comfy-table = { version = "8", default-features = false }
wf-project-remote = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
wp-self-update = { workspace = true }
