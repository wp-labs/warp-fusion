[package]
name = "wfusion"
version = "0.5.2" #@gxl:set(version)
edition.workspace = true
license.workspace = true

[[bin]]
name = "wfusion"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
wf-runtime.workspace = true
wp-connectors.workspace = true
wp-core-connectors.workspace = true
wf-config.workspace = true
wf-project-remote = { workspace = true }
orion-error.workspace = true
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
moju-derive = { git = "https://github.com/dayu-sec/moju-derive.git", branch = "main" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# High-concurrency small-object allocator. The system allocator (macOS
# libmalloc) serializes cross-thread alloc/free on per-zone unfair locks —
# with sharded rule workers doing ~M allocs/s each, that lock dominated the
# on-each hot path (sample showed __ulock_wait2 under _malloc_zone_realloc).
mimalloc = "0.1"
# 内存分账：mi_process_info（peak_rss / peak_commit）经 wf-runtime 的
# metrics::alloc_stats provider 钩子进入 metrics.ndjson——把「进程峰值 vs 引擎
# window_bytes 的缺口是谁持有的」变成 bench 可读数字（q13 内存 issue）。
# 已是 mimalloc 的传递依赖，此处显式声明以直接调用 API。
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
wf-project-remote = { workspace = true, features = ["test-support"] }
git2 = { workspace = true }
